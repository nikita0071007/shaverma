<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Моя шаверма</title>
<meta name="theme-color" content="#1F1712">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600&display=swap">
<style>
/* Layout: one column. Stage (hall or 3D kitchen, switched by tabs) on top, order panel under it; day summary slides over the stage. */
:root{
  --bg:#1F1712;
  --panel:#2B2019;
  --line:#4A382B;
  --cream:#F6E7C8;
  --muted:#B39B80;
  --turmeric:#F2A93B;
  --chili:#D8432B;
  --pistachio:#8FB339;
  --font-display:'Unbounded','Arial Black',sans-serif;
  --font-body:'Onest','Segoe UI',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg);color:var(--cream);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:600;font-size:clamp(22px,4.5vw,32px);margin:0;letter-spacing:.01em;color:var(--turmeric);text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.hud{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-width:96px}
.stat .k{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--font-display);font-size:18px;font-variant-numeric:tabular-nums}
.timebox{flex:1 1 180px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0}
.timebox .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.bar{height:6px;background:#140E0A;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--turmeric)}
.stage{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#C9AC7C}
#cv{display:block;width:100%;height:auto;aspect-ratio:640/400;touch-action:manipulation;cursor:pointer}
.overlay{position:absolute;inset:0;background:rgba(24,16,11,.93);padding:18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.overlay h2{font-family:var(--font-display);font-weight:600;font-size:clamp(18px,3.6vw,24px);margin:0;color:var(--turmeric);text-wrap:balance}
.overlay p{margin:0;color:var(--cream);max-width:60ch}
.overlay ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:60ch}
.facts{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--muted)}
.facts b{color:var(--cream);font-weight:600;font-variant-numeric:tabular-nums}
.upgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.upg{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.upg b{font-weight:600}
.upg span{color:var(--muted);font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--turmeric);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--chili);border-color:var(--chili);color:#FFF4DE;font-weight:600}
.btn.primary:hover{background:#E4543A}
.btn.go{background:var(--turmeric);border-color:var(--turmeric);color:#2B1A0A;font-weight:600;align-self:flex-start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:8px;margin-bottom:8px}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 16px;font-weight:600}
.tab[aria-pressed="true"]{background:var(--turmeric);border-color:var(--turmeric);color:#2B1A0A}
.tab span{font-weight:500;opacity:.8}
.kitchen{position:absolute;inset:0;background:#2a1d15;touch-action:none}
.kitchen canvas{display:block;width:100%;height:100%}
.khint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(24,16,11,.82);color:var(--cream);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;white-space:nowrap;pointer-events:none;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.tbar{margin-top:8px}
.build{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.build li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.build li span:last-child{color:var(--muted);text-align:right}
.build li.on span:last-child{color:var(--cream);font-weight:600}
.build li b{display:inline-block;min-width:1.1em;text-align:center}
.build li.ok span:last-child{color:var(--pistachio);font-weight:600}
.build li.bad span:last-child{color:#FF8A6B;font-weight:600}
.build li.ok{border-color:rgba(143,179,57,.5)}
.build li.bad{border-color:rgba(255,138,107,.6)}
.lbl{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.ticket{border:1px dashed var(--muted);border-radius:8px;padding:10px 12px;margin-bottom:12px;min-height:62px}
.ticket p{margin:0;font-size:16px;font-weight:500}
.btns{display:flex;gap:8px;width:100%}
.btns .btn{flex:1}
#msg{margin:0;min-height:20px;font-size:13px;color:var(--muted);text-align:center;width:100%}
/* Wide screens: header and HUD share a row, order panel sits beside the floor so nothing needs scrolling. */
.main{display:flex;flex-direction:column;gap:14px}
@media (min-width:1000px){
  .wrap{max-width:clamp(940px,calc((100vh - 176px)*1.6 + 354px),1280px)}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
  .hud{flex:0 1 780px;flex-wrap:nowrap}
  .hud .stat{min-width:0;padding:8px 12px}
  .hud .timebox{min-width:140px}
  .main{display:grid;grid-template-columns:minmax(0,1fr) 340px;align-items:start}
  .main .panel{margin-top:44px}
}
/* Phones: full-screen game, no page scroll. Compact HUD on top, the stage takes all free height,
   tabs float over it, and a short order bar with the buttons sits at the bottom within thumb reach. */
@media (max-width:700px){
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  .wrap{height:100dvh;max-width:none;gap:6px;
    padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
  .top{display:flex;align-items:center;gap:8px}
  .top header{display:none}
  .hud{flex:1;gap:4px;flex-wrap:nowrap;min-width:0}
  .stat{min-width:0;padding:3px 7px;flex:none}
  .stat .k{font-size:9px}
  .stat .v{font-size:13px}
  .timebox{flex:1;padding:3px 7px;gap:3px}
  .timebox .k{font-size:9px}
  .timebox .k span:first-child{display:none}
  .main{flex:1;min-height:0;gap:6px}
  .col{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
  .tabs{position:absolute;top:8px;left:8px;z-index:3;margin:0}
  .tab{padding:5px 12px;font-size:13px;background:rgba(43,32,25,.88)}
  .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  #cv{max-height:100%;width:auto;max-width:100%;height:auto}
  .overlay{padding:56px 14px 14px}
  .khint{font-size:12px;bottom:8px;padding:4px 10px}
  .panel{flex:none;padding:8px;gap:6px}
  .ticket{padding:6px 10px;min-height:0}
  .ticket .lbl{display:none}
  .ticket p{font-size:14px}
  .tbar{margin-top:5px;height:4px}
  .panel .lbl{display:none}
  .build{flex-direction:row;flex-wrap:wrap;gap:4px}
  .build li{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;gap:4px}
  .build li.on{border-color:var(--turmeric)}
  .btn{padding:10px 14px}
  #msg{min-height:16px;font-size:12px}
}
.ovbtns{display:flex;flex-wrap:wrap;gap:10px}
.stage:has(#cv[hidden]){aspect-ratio:16/10}   /* 3D mode: the stage keeps the flat hall's proportions */
@media (max-width:700px){.stage:has(#cv[hidden]){aspect-ratio:auto}}
.bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bub{position:absolute;left:0;top:0;pointer-events:auto;border:2px solid #2B1D14;background:#FFF6E0;border-radius:10px;padding:4px 7px 6px;display:flex;flex-direction:column;gap:4px;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.bub::after{content:'';position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:#2B1D14;border-bottom:0}
.bub.sel{border-color:var(--turmeric);box-shadow:0 0 0 3px rgba(242,169,59,.45)}
.bub.courier{background:#FFE2C8}
.bub .pt{display:block;height:4px;border-radius:2px;background:rgba(0,0,0,.2);overflow:hidden}
.bub .pt i{display:block;height:100%}
.bub .ic{display:flex;gap:5px;align-items:center}
.bub .ic i{display:block;width:14px;height:14px;border:1px solid rgba(0,0,0,.35)}
.bub .dot{border-radius:50%}
.bub .sq{border-radius:3px}
.bub .ring{border-radius:50%;border:2.5px solid #9B6BB8!important;background:transparent;position:relative}
.bub .ring.no::after{content:'';position:absolute;left:-3px;right:-3px;top:50%;height:2px;background:#D8432B;transform:rotate(-45deg)}
.bub .cup{clip-path:polygon(0 0,100% 0,85% 100%,15% 100%);height:16px!important}
.coach{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);z-index:4;width:min(560px,calc(100% - 24px));background:var(--turmeric);color:#2B1A0A;border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.45);animation:coachIn .35s ease-out}
.coach p{margin:0;flex:1;font-weight:600;font-size:15px}
.coach .btn{flex:none;background:rgba(0,0,0,.12);border-color:transparent;color:#2B1A0A;font-size:12px;padding:6px 10px}
@keyframes coachIn{from{opacity:0;transform:translate(-50%,10px)}}
.bub.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(242,169,59,.55)}}
@media (max-width:700px){.coach{bottom:44px}.coach p{font-size:13px}}
.rail{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;overflow-x:auto;pointer-events:none;z-index:2;scrollbar-width:none}
.tk{pointer-events:auto;flex:none;background:#FFFDF6;color:#2B1D14;border:1px solid #d8cdb8;border-top:4px solid #2B1D14;border-radius:4px 4px 8px 8px;padding:5px 8px 6px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;box-shadow:0 3px 8px rgba(0,0,0,.35);font-size:12px}
.tk b{font-weight:700}
.tk.sel{border-top-color:var(--turmeric);outline:2px solid var(--turmeric)}
.tk.courier{background:#FFE9D6;border-top-color:#FF7A1A}
.tk .pt{display:block;width:100%;height:3px;background:rgba(0,0,0,.15);border-radius:2px;overflow:hidden}
.tk .pt i{display:block;height:100%}
.tk .ic{display:flex;gap:4px;align-items:center}
.tk .ic i{display:block;width:12px;height:12px;border:1px solid rgba(0,0,0,.35)}
.tk .dot{border-radius:50%}.tk .sq{border-radius:3px}
.tk .ring{border-radius:50%;border:2px solid #9B6BB8!important;background:transparent;position:relative}
.tk .ring.no::after{content:'';position:absolute;left:-3px;right:-3px;top:50%;height:2px;background:#D8432B;transform:rotate(-45deg)}
.tk .cup{clip-path:polygon(0 0,100% 0,85% 100%,15% 100%);height:14px!important}
@media (max-width:700px){.rail{top:46px}}
.flt{position:absolute;left:0;top:0;font-weight:700;font-size:15px;white-space:nowrap;text-shadow:0 1px 0 #1a120c,0 0 6px rgba(0,0,0,.7)}
.gems{cursor:pointer;color:var(--cream);text-align:left}
.gems .v{font-size:16px}
.devtag{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:999px;background:#3ad6ff;color:#062a33;font:700 11px var(--font-body);vertical-align:middle}
.shop{z-index:6}
.shop .tabsrow{display:flex;gap:6px;flex-wrap:wrap}
.shop .tabsrow button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px}
.shop .tabsrow button[aria-pressed="true"]{background:var(--turmeric);color:#2B1A0A;border-color:var(--turmeric)}
.shop .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.shop .item{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;background:rgba(43,32,25,.7)}
.shop .item .sw{height:34px;border-radius:6px;border:1px solid rgba(0,0,0,.4)}
.shop .item b{font-size:14px}
.shop .item span{font-size:12px;color:var(--muted)}
.shop .item.on{border-color:var(--pistachio);box-shadow:0 0 0 2px rgba(143,179,57,.35)}
.shop .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mute{font-size:18px;line-height:1;cursor:pointer;color:var(--cream);min-width:0;padding:8px 12px}
.mute[aria-pressed="true"]{opacity:.55}
.overlay p.credits{color:var(--muted);font-size:12px;margin-top:auto}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
  <header>
    <h1>Моя шаверма</h1>
    <p class="sub">Прототип: зал с гостями и 3D-кухня</p>
  </header>

  <div class="hud">
    <div class="stat"><span class="k">День</span><span class="v" id="hDay">1</span></div>
    <div class="stat"><span class="k">Деньги</span><span class="v" id="hMoney">0 ₽</span></div>
    <div class="stat"><span class="k">Репутация</span><span class="v" id="hRep">3.0 ★</span></div>
    <button class="stat gems" id="shopBtn" aria-label="Магазин"><span class="k">Магазин</span><span class="v" id="hGems">💎 0</span></button>
    <button class="stat mute" id="mute" aria-label="Звук">🔊</button>
    <div class="timebox"><span class="k"><span>До закрытия</span><span id="hLeft">—</span></span><div class="bar"><i id="hTime"></i></div></div>
  </div>
  </div>

  <div class="main">
  <div class="col">
  <div class="tabs">
    <button class="tab" id="tabHall" aria-pressed="true">Зал <span id="waitN"></span></button>
    <button class="tab" id="tabKitchen" aria-pressed="false">Кухня</button>
  </div>
  <div class="stage">
    <canvas id="cv" width="640" height="400" aria-label="Зал шаурмичной"></canvas>
    <div class="kitchen" id="kitchen" hidden aria-label="Кухня: вертела, лаваш, овощи и соусы"></div>
    <div class="coach" id="coach" hidden><p id="coachText"></p><button type="button" class="btn" id="coachSkip">Пропустить обучение</button></div>
    <div class="overlay" id="ov"></div>
    <div class="overlay shop" id="shop" hidden></div>
  </div>
  </div>

  <section class="panel">
    <div class="ticket"><span class="lbl">Заказ гостя</span><p id="tkText">Нажмите на гостя с пузырём заказа.</p><div class="bar tbar"><i id="tkBar"></i></div></div>
    <div><span class="lbl" id="blLbl">На лаваше</span><ul class="build" id="bl"></ul></div>
    <div class="btns">
      <button class="btn" id="reset">Сбросить</button>
      <button class="btn primary" id="serve">Завернуть</button>
    </div>
    <p id="msg" aria-live="polite"></p>
  </section>
  </div>
</div>

<script src="js/sound.js"></script>
<script>
(function(){
function sfx(n){if(window.Sfx)Sfx.play(n);}
var lastSay=0;
function say(t,force){var now=performance.now();if(!force&&now-lastSay<5000)return;lastSay=now;if(window.Sfx)Sfx.say(t);}
var HELLO=['Здравствуйте! Присаживайтесь, сейчас всё будет.','Добрый день! Что будем заказывать?','Привет! Шаверма уже крутится.','Здравствуйте! Секундочку, приму заказ.'];
var W=640,H=400;
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);

var MEAT={chicken:{name:'Курица',c:'#E6B04F'},beef:{name:'Говядина',c:'#8A3B22'}};
var SAUCE={garlic:{name:'Чесночный',c:'#FFF1CF'},spicy:{name:'Острый',c:'#D8432B'},cheese:{name:'Сырный',c:'#F2C23B'}};
var SAUCE_KEYS=['garlic','spicy','cheese'];
var DRINK={tea:{name:'Чай',c:'#9A4A1C'},ayran:{name:'Айран',c:'#F3EFE4'},cola:{name:'Кола',c:'#2A0F06'}};
var DRINK_KEYS=['tea','ayran','cola'],DRINK_PRICE=60;
/* Delivery couriers: one walks in every COURIER_EVERY seconds of play (the timer carries over between days),
   sets the open delivery bag down by the counter and waits for a take-away order. */
var COURIER_BRAND='Мчим Еда',COURIER_COLOR='#FF7A1A',COURIER_EVERY=300,COURIER_FIRST=60,COURIER_BONUS=100;
var COURIER_SPOT={x:520,y:140};   /* by the glass counter's open end */
var TABLES=[[150,150],[150,265],[290,150],[290,265],[430,150],[430,265]];
var DOOR={x:662,y:348};
var SKIN=['#F2C9A0','#E0AC83','#C58C63','#8D5A3B'];
var SHIRT=['#3B82C4','#7A5CC4','#2A9D8F','#E9A23B','#C7546B','#4F7A3A','#5B6C8F'];
var HAIR=['#2B1D14','#5A3A22','#B5651D','#1A1A1A','#8A8A8A'];

var G,KST={meat:null,meatN:0,tomato:false,cucumber:false,onion:false,sauce:null};
var view='hall';
function K(){return window.Kitchen;}
var anim=0;

function newGame(){
  G={courierT:COURIER_EVERY-COURIER_FIRST,phase:'intro',day:1,money:0,rep:3,tables:3,comfort:0,sign:0,perks:{knife:0,grill:0,pour:0},gems:20,dev:false,
    owned:{outfit_white:1,hat_chef:1,hat_none:1,look_misha:1,theme_brick:1},equip:{outfit:'white',hat:'chef',look:'misha',theme:'brick',waiter:false,cat:false},time:0,spawnT:1,cust:[],occ:[],sel:null,floats:[],stats:{served:0,lost:0,earned:0},lastLeft:-1};
}
/* ---------- save ---------- */
/* Progress is saved between days: a reload mid-day restarts that day with the money it opened with. */
var SAVE_KEY='shaverma-save-v1';
function save(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({v:1,day:G.phase==='summary'?G.day+1:G.day,money:G.money,rep:G.rep,tables:G.tables,comfort:G.comfort,sign:G.sign,perks:G.perks,courierT:G.courierT,
    gems:G.gems,dev:G.dev,owned:G.owned,equip:G.equip}));}catch(e){}
}
function loadSave(){
  try{var s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&s.v===1)return s;}catch(e){}
  return null;
}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function applySave(s){
  G.day=Math.max(1,s.day|0);G.money=Math.max(0,+s.money||0);G.rep=clamp(+s.rep||3,1,5);
  G.tables=clamp(s.tables|0,3,6);G.comfort=clamp(s.comfort|0,0,3);G.sign=clamp(s.sign|0,0,3);
  if(typeof s.courierT==='number')G.courierT=clamp(s.courierT,0,COURIER_EVERY);
  if(s.perks)for(var k in G.perks)G.perks[k]=s.perks[k]?1:0;
  if(typeof s.gems==='number')G.gems=Math.max(0,s.gems|0);
  G.dev=!!s.dev;
  if(s.owned)for(var o in s.owned)G.owned[o]=1;
  if(s.equip)for(var q in G.equip)if(q in s.equip)G.equip[q]=s.equip[q];
}

/* ---------- tutorial: day 1 for a new player is one patient guest and a coach walking through each step ---------- */
var TUT_KEY='shaverma-tutorial-done';
function tutorialDone(){try{return localStorage.getItem(TUT_KEY)==='1';}catch(e){return true;}}
var coachEl=document.getElementById('coach'),coachText=document.getElementById('coachText'),lastCoach='';
function coach(t){
  if(t===lastCoach)return;lastCoach=t;
  coachEl.hidden=!t;if(t){coachText.textContent=t;say(t,true);}
}
function endTutorial(praise){
  G.tut=null;coach('');try{localStorage.setItem(TUT_KEY,'1');}catch(e){}
  G.spawnT=2;
  if(praise){msg('Обучение пройдено! Дальше гости пойдут сами.');say('Отлично! Дальше гости пойдут сами.',true);}
}
document.getElementById('coachSkip').onclick=function(){endTutorial(false);};
/* which step the player is on, worked out from what has been done so far */
function tutorialStep(){
  var c=G.cust[0];
  if(!c||c.state==='enter')return 'Заходит первый гость. Сейчас он сядет за столик…';
  if(c.state!=='wait')return '';
  if(view!=='kitchen')return 'Над гостем пузырь с заказом. Нажмите на него — откроется кухня.';
  if(KST.stage==='grill')return KST.toast<(K()?K().TOAST_OK:0.55)?'Шаверма жарится. Ждём, пока станет золотистой…':'Золотистая! Нажмите «Подать».';
  if(KST.meat&&KST.meat!=='chicken')return 'Гость просил курицу. Нажмите «Сбросить» и срежьте с левого вертела.';
  if(KST.meatN<3)return 'Ведите пальцем вверх-вниз по левому вертелу с курицей — нож будет срезать мясо. Нужно 3 порции.';
  if(!KST.tomato)return 'Нажмите на миску с помидорами.';
  if(!KST.cucumber)return 'Теперь огурцы.';
  if(!KST.onion)return 'Гость просил с луком — нажмите на миску с луком.';
  if(KST.sauce!=='garlic')return KST.sauce?'Нужен чесночный соус. Нажмите «Сбросить» и соберите заново.':'Полейте чесночным соусом — белая бутылка.';
  return 'Всё по заказу! Нажмите «Завернуть» — шаверма ляжет на гриль.';
}
function moveAlong(c,dt){
  var left=95*dt;
  while(left>0&&c.path.length){
    var t=c.path[0],dx=t.x-c.x,dy=t.y-c.y,d=Math.hypot(dx,dy);
    if(d<=left){c.x=t.x;c.y=t.y;c.path.shift();left-=d;}
    else{c.x+=dx/d*left;c.y+=dy/d*left;left=0;}
  }
  return c.path.length===0;
}
function leave(c){
  c.state='leave';c.moving=true;if(c.table>=0)G.occ[c.table]=false;
  c.path=[{x:c.lane,y:c.seat.y},{x:c.lane,y:348},{x:DOOR.x,y:348}];
  if(G.sel===c){G.sel=null;pickNext();}
}
function pickNext(){
  if(G.sel&&G.sel.state==='wait')return;
  G.sel=null;
  var best=null;
  G.cust.forEach(function(c){if(c.state==='wait'&&(!best||c.patience<best.patience))best=c;});
  G.sel=best;updateTicket();
}
function float(x,y,text,color){G.floats.push({x:x,y:y,text:text,color:color,t:0});}

function update(dt){
  anim+=dt;
  if(G.phase!=='play'||G.paused)return;
  if(G.tut){coach(tutorialStep());G.cust.forEach(function(c){c.patience=c.maxP;});}   /* nobody leaves and the clock stops while learning */
  else G.time+=dt;
  var len=dayLen();
  if(G.time<len&&!G.tut){
    G.spawnT-=dt;
    if(G.spawnT<=0)G.spawnT=spawn()?nextInterval():1;
    G.courierT+=dt;
    if(G.courierT>=COURIER_EVERY&&!G.cust.some(function(c){return c.courier;})){G.courierT=0;spawnCourier();}
  }
  G.cust.slice().forEach(function(c){
    if(c.state==='enter'){
      if(moveAlong(c,dt)){c.state='wait';c.moving=false;sfx('order');
        say(c.courier?'Привет, Мчим Еда! Сейчас соберу заказ.':HELLO[Math.floor(Math.random()*HELLO.length)]);if(!G.sel){G.sel=c;updateTicket();}}
    }else if(c.state==='wait'){
      if(c.courier)c.bagOpen=Math.min(1,c.bagOpen+dt*2.5);
      c.patience-=dt*(G.equip.waiter?0.75:1);   /* a waiter keeps guests company */
      if(c.patience<=0){
        G.rep=clamp(G.rep-0.3,1,5);G.stats.lost++;
        float(c.x,c.y-60,'Ушёл недовольным','#FF8A6B');sfx('bad');
        leave(c);hud();
      }
    }else if(c.state==='eat'){
      if(c.courier)c.bagOpen=Math.max(0,c.bagOpen-dt*2.5);
      c.eatT-=dt;
      if(c.eatT<=0){
        G.money+=c.pay;G.stats.earned+=c.pay;sfx('coin');
        float(c.x,c.y-50,'+'+Math.round(c.pay)+' ₽','#F2A93B');
        leave(c);hud();
      }
    }else if(c.state==='leave'){
      if(moveAlong(c,dt)){G.cust.splice(G.cust.indexOf(c),1);}
    }
  });
  G.floats.forEach(function(f){f.t+=dt;});
  G.floats=G.floats.filter(function(f){return f.t<1.6;});
  var left=Math.max(0,Math.ceil(len-G.time));
  if(left!==G.lastLeft){
    G.lastLeft=left;
    document.getElementById('hLeft').textContent=left>0?left+' с':'закрываемся';
  }
  document.getElementById('hTime').style.width=clamp(G.time/len*100,0,100)+'%';
  document.getElementById('tkBar').style.width=(G.sel&&G.sel.state==='wait'?G.sel.patience/G.sel.maxP*100:0)+'%';
  var waiting=G.cust.filter(function(c){return c.state==='wait';}).length;
  var wt=waiting?'· ждут '+waiting:'';
  if(wt!==G.lastWait){G.lastWait=wt;document.getElementById('waitN').textContent=wt;}
  if(G.time>=len&&G.cust.length===0)showSummary();
}

var VEG_NAMES={tomato:'Помидоры',cucumber:'Огурцы',onion:'Лук'};
function resetBuild(){if(K())K().reset();else window.onKitchenChange({meat:null,meatN:0,tomato:false,cucumber:false,onion:false,sauce:null});}

/* The panel is a checklist: what the selected guest ordered, and whether the lavash matches yet.
   ✓ done, ✗ wrong, · still to do. With no guest selected it just lists what is on the lavash. */
function renderBuild(){
  var need=K()?K().MEAT_NEED:3,c=G&&G.sel&&G.sel.state==='wait'?G.sel:null,o=c&&c.order;
  var meatNow=KST.meat==='mixed'?'смешали':KST.meat?MEAT[KST.meat].name.toLowerCase():'';
  function st(ok,wrong){return wrong?'bad':ok?'ok':'';}
  var rows;
  if(o){
    var meatWrong=KST.meatN>0&&KST.meat!==o.meat;
    rows=[
      ['Мясо: '+MEAT[o.meat].name.toLowerCase(),meatWrong?meatNow:Math.min(KST.meatN,need)+'/'+need,st(!meatWrong&&KST.meatN>=need,meatWrong)],
      ['Помидоры','',st(KST.tomato)],
      ['Огурцы','',st(KST.cucumber)],
      [o.onion?'С луком':'Без лука','',o.onion?st(KST.onion):(KST.onion?'bad':'ok')],
      ['Соус: '+SAUCE[o.sauce].name.toLowerCase(),KST.sauce&&KST.sauce!==o.sauce?(KST.sauce==='mixed'?'смешали':SAUCE[KST.sauce].name.toLowerCase()):'',st(KST.sauce===o.sauce,KST.sauce&&KST.sauce!==o.sauce)]
    ];
    if(o.drink){
      var dWrong=KST.drink&&KST.drink!==o.drink,over=KST.fill>(K()?K().FILL_MAX:1.02);
      rows.push(['Напиток: '+DRINK[o.drink].name.toLowerCase(),dWrong?(KST.drink==='mixed'?'смешали':DRINK[KST.drink].name.toLowerCase()):(KST.drink?(over?'перелили':Math.round(Math.min(KST.fill,1)*100)+'%'):''),
        st(!dWrong&&!over&&KST.fill>=(K()?K().FILL_OK:0.7),dWrong||over)]);
    }
  }else{
    rows=[
      ['Мясо',KST.meatN?meatNow+' '+Math.min(KST.meatN,need)+'/'+need:'—',KST.meatN?'on':''],
      ['Помидоры',KST.tomato?'есть':'—',KST.tomato?'on':''],
      ['Огурцы',KST.cucumber?'есть':'—',KST.cucumber?'on':''],
      ['Лук',KST.onion?'есть':'—',KST.onion?'on':''],
      ['Соус',KST.sauce==='mixed'?'смешали':KST.sauce?SAUCE[KST.sauce].name:'—',KST.sauce?'on':''],
      ['Напиток',KST.drink==='mixed'?'смешали':KST.drink?DRINK[KST.drink].name+' '+Math.round(Math.min(KST.fill,1)*100)+'%':'—',KST.drink?'on':'']
    ];
  }
  if(K()&&KST.stage!=='build'){
    var lbl=KST.stage==='rolling'?'заворачиваем':K().toastLabel(KST.toast);
    rows.push(['Гриль',lbl,KST.toast>K().TOAST_BURNT?'bad':KST.toast>=K().TOAST_OK&&KST.toast<=K().TOAST_MAX?'ok':'']);
  }
  var mark={ok:'✓',bad:'✗',on:'',"":'·'};
  document.getElementById('bl').innerHTML=rows.map(function(r){
    return '<li class="'+r[2]+'"><span>'+r[0]+'</span><span>'+(r[1]?r[1]+' ':'')+(o?'<b>'+mark[r[2]]+'</b>':'')+'</span></li>';
  }).join('');
  document.getElementById('blLbl').textContent=o?(c.courier?'Заказ курьера':'Заказ стола '+(c.table+1)):'На лаваше';
  document.getElementById('serve').textContent=K()&&KST.stage==='build'?'Завернуть':'Подать';
}
function setView(v){
  view=v;
  document.getElementById('tabHall').setAttribute('aria-pressed',v==='hall'?'true':'false');
  document.getElementById('tabKitchen').setAttribute('aria-pressed',v==='kitchen'?'true':'false');
  if(K())K().setView(v);
}
/* the 3D scene (open kitchen + hall) takes over from the flat hall once it is ready */
window.Game={
  get G(){return G;},
  COURIER_BRAND:COURIER_BRAND,COURIER_COLOR:COURIER_COLOR,
  select:function(c){if(G.phase!=='play'||c.state!=='wait')return;sfx('click');G.sel=c;updateTicket();setView('kitchen');}
};
document.getElementById('tabHall').onclick=function(){sfx('click');setView('hall');};
document.getElementById('tabKitchen').onclick=function(){sfx('click');setView('kitchen');};
var muteBtn=document.getElementById('mute');
function syncMute(){var m=window.Sfx&&Sfx.muted;muteBtn.textContent=m?'🔇':'🔊';muteBtn.setAttribute('aria-pressed',m?'true':'false');}
muteBtn.onclick=function(){if(window.Sfx){Sfx.muted=!Sfx.muted;syncMute();}};syncMute();
document.addEventListener('kitchenready',function(){cv.hidden=true;K().start();setView(view);syncPerks();renderBuild();});
function orderText(o){
  return MEAT[o.meat].name+', '+SAUCE[o.sauce].name.toLowerCase()+' соус, '+(o.onion?'с луком':'без лука')+(o.drink?' + '+DRINK[o.drink].name.toLowerCase():'');
}
function updateTicket(){
  var el=document.getElementById('tkText');
  if(K())K().setOrder(G.sel&&G.sel.state==='wait'?G.sel.order:null);
  if(G.sel&&G.sel.state==='wait'){el.textContent=(G.sel.courier?'Курьер '+COURIER_BRAND+', с собой':'Стол '+(G.sel.table+1))+': '+orderText(G.sel.order);}
  else{el.textContent='Нажмите на гостя с пузырём заказа.';}
  renderBuild();
}
document.getElementById('reset').onclick=function(){resetBuild();msg('');};
document.getElementById('serve').onclick=function(){
  if(G.phase!=='play')return;
  var c=G.sel;
  if(!c||c.state!=='wait'){msg('Сначала выберите гостя с заказом.');return;}
  if(K()&&KST.stage==='rolling')return;
  if(!KST.meatN){msg('Срежьте мясо с вертела.');setView('kitchen');return;}
  if(!KST.sauce){msg('Полейте соусом.');setView('kitchen');return;}
  /* step 1: wrap it and put it on the grill */
  if(K()&&KST.stage==='build'){K().roll();sfx('click');msg('На гриле. Подайте, когда станет золотистой.');return;}
  var bad=[];
  if(KST.meat!==c.order.meat)bad.push('мясо');
  else if(KST.meatN<(K()?K().MEAT_NEED:3))bad.push('мало мяса');
  if(!KST.tomato||!KST.cucumber)bad.push('овощи');
  if(KST.onion!==c.order.onion)bad.push('лук');
  if(KST.sauce!==c.order.sauce)bad.push('соус');
  if(c.order.drink){
    if(!KST.drink){msg('Налейте '+DRINK[c.order.drink].name.toLowerCase()+'.');setView('kitchen');return;}
    if(KST.drink!==c.order.drink)bad.push('напиток');
    else if(KST.fill>(K()?K().FILL_MAX:1.02))bad.push('перелили');
    else if(KST.fill<(K()?K().FILL_OK:0.7))bad.push('недолили');
  }
  var crisp=0;
  if(K()){
    if(KST.toast>K().TOAST_BURNT)bad.push('сгорела');
    else if(KST.toast<K().TOAST_OK)bad.push('не прожарена');
    else if(KST.toast<=K().TOAST_MAX)crisp=30;   /* golden and crispy: bonus tip */
  }
  var tip=Math.round(100*(c.patience/c.maxP))+crisp;
  c.pay=Math.max(100,250+tip-80*bad.length)+(c.order.drink?DRINK_PRICE:0)+(c.courier?COURIER_BONUS:0);
  c.state='eat';c.eatT=c.courier?1.2:3.5;   /* a courier just packs the order and goes */
  G.stats.served++;
  if(bad.length){
    G.rep=clamp(G.rep-0.1*bad.length,1,5);
    msg('Ошибка: '+bad.join(', ')+'. Гость недоволен, оплата ниже.');sfx('bad');
  }else{
    G.rep=clamp(G.rep+0.1,1,5);
    G.gems+=1;
    msg((crisp?'Идеально, хрустящая! ':'Идеально! ')+'Чаевые: '+tip+' ₽, +1 💎');sfx('perfect');
    say(c.courier?'Готово, забирайте!':'Приятного аппетита!');
  }
  if(G.tut)endTutorial(true);
  G.sel=null;pickNext();updateTicket();hud();
  if(K())K().take(function(){if(G.phase==='play')setView('hall');});
  else resetBuild();
};
cv.addEventListener('pointerdown',function(e){
  if(G.phase!=='play')return;
  var r=cv.getBoundingClientRect();
  var x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  var best=null,bd=1e9;
  G.cust.forEach(function(c){
    if(c.state!=='wait')return;
    var d=Math.min(Math.hypot(x-c.x,y-(c.y-18)),Math.hypot(x-c.x,y-(c.y-52)));
    if(d<36&&d<bd){best=c;bd=d;}
  });
  if(best){G.sel=best;updateTicket();setView('kitchen');}
});

/* ---------- drawing ---------- */
function rr(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);
  c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();
}
function bg(){
  for(var y=90;y<H;y+=40)for(var x=0;x<W;x+=40){
    ctx.fillStyle=((x/40+(y-90)/40)%2===0)?'#CDB083':'#C2A476';ctx.fillRect(x,y,40,40);
  }
  ctx.fillStyle='#8C4A2F';ctx.fillRect(0,0,W,90);
  ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=1;
  for(var by=0;by<90;by+=15){ctx.beginPath();ctx.moveTo(0,by);ctx.lineTo(W,by);ctx.stroke();
    for(var bx=((by/15)%2)*20;bx<W;bx+=40){ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx,by+15);ctx.stroke();}}
  ctx.fillStyle='#5A2E1C';ctx.fillRect(0,86,W,6);
  /* counter */
  ctx.fillStyle='#4A2F1E';ctx.fillRect(20,78,430,22);
  ctx.fillStyle='#6B4429';ctx.fillRect(20,86,430,14);
  ctx.fillStyle='#C98B4A';ctx.fillRect(14,60,442,20);
  /* sign */
  ctx.fillStyle='#2B1D14';rr(ctx,250,6,190,26,5);ctx.fill();
  ctx.strokeStyle='#C98B4A';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#F2A93B';ctx.font='600 13px Unbounded,Arial Black,sans-serif';ctx.textAlign='center';ctx.fillText('МОЯ ШАВЕРМА',345,24);
  for(var k=0;k<4+G.sign*3;k++){
    var on=(Math.floor(anim*3)+k)%2===0;
    ctx.fillStyle=on?'#FFD27A':'#8A5A2A';
    ctx.beginPath();ctx.arc(256+k*(178/(3+G.sign*3)),9,1.8,0,Math.PI*2);ctx.fill();
  }
  /* spit */
  ctx.strokeStyle='#FF7A2F';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(86,28);ctx.lineTo(86,60);ctx.moveTo(134,28);ctx.lineTo(134,60);ctx.stroke();
  ctx.strokeStyle='#777';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(110,12);ctx.lineTo(110,62);ctx.stroke();
  ctx.fillStyle='#B5651D';ctx.beginPath();ctx.moveTo(94,62);ctx.lineTo(126,62);ctx.lineTo(121,22);ctx.lineTo(99,22);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#8C4A12';ctx.lineWidth=1.5;
  for(var s=0;s<5;s++){var yy=28+s*8,off=Math.sin(anim*2+s)*3;ctx.beginPath();ctx.moveTo(98+s*-1+off*0,yy);ctx.lineTo(122+s*1,yy);ctx.stroke();}
  ctx.fillStyle='rgba(255,230,170,.35)';var sx=104+Math.sin(anim*2.2)*6;ctx.fillRect(sx,24,3,36);
  /* grill */
  ctx.fillStyle='#2B2B2B';rr(ctx,170,62,64,14,3);ctx.fill();
  ctx.fillStyle='#C9743A';for(var g=0;g<4;g++){ctx.beginPath();ctx.arc(182+g*14,69,3,0,Math.PI*2);ctx.fill();}
  /* cook */
  ctx.fillStyle='#F2C9A0';ctx.beginPath();ctx.arc(250,54,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';rr(ctx,242,38,16,10,3);ctx.fill();
  /* sauces */
  [['#FFF1CF',290],['#D8432B',310],['#F2C23B',330]].forEach(function(b){
    ctx.fillStyle=b[0];rr(ctx,b[1]-6,44,12,22,3);ctx.fill();
    ctx.fillStyle='#444';ctx.fillRect(b[1]-3,40,6,5);
  });
  /* register */
  ctx.fillStyle='#3A3A3A';rr(ctx,384,46,40,24,4);ctx.fill();
  ctx.fillStyle='#8FB339';ctx.fillRect(390,50,28,8);
  ctx.fillStyle='#777';ctx.fillRect(390,62,28,4);
  /* menu board */
  ctx.fillStyle='#2B1D14';rr(ctx,478,12,140,62,5);ctx.fill();
  ctx.strokeStyle='#C98B4A';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#F6E7C8';ctx.textAlign='left';ctx.font='600 11px Onest,sans-serif';ctx.fillText('МЕНЮ',490,30);
  ctx.font='400 11px Onest,sans-serif';ctx.fillText('Шаверма  250 ₽',490,47);ctx.fillText('Напитки  60 ₽',490,62);
  /* door and mat */
  ctx.fillStyle='#5C3B26';ctx.fillRect(596,326,44,50);
  ctx.fillStyle='#F6D98A';ctx.fillRect(630,300,10,96);
  ctx.fillStyle='#5C3B26';ctx.fillRect(626,296,4,104);
  /* plants */
  [[26,380],[560,150]].forEach(function(p){
    ctx.fillStyle='#7A4A2A';ctx.fillRect(p[0]-9,p[1],18,14);
    ctx.fillStyle='#4F7A3A';ctx.beginPath();ctx.arc(p[0]-6,p[1]-6,9,0,Math.PI*2);ctx.arc(p[0]+6,p[1]-8,10,0,Math.PI*2);ctx.arc(p[0],p[1]-14,8,0,Math.PI*2);ctx.fill();
  });
}
function drawTable(i){
  var x=TABLES[i][0],y=TABLES[i][1];
  if(i>=G.tables){
    ctx.setLineDash([5,5]);ctx.strokeStyle='rgba(246,231,200,.45)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.ellipse(x,y,36,22,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);return;
  }
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(x,y+10,38,22,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#6B3F22';rr(ctx,x-54,y-10,20,28,5);ctx.fill();
  ctx.fillStyle='#E0A862';ctx.strokeStyle='#8B5A33';ctx.lineWidth=3;
  ctx.beginPath();ctx.ellipse(x,y,36,22,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';rr(ctx,x+14,y-6,8,10,2);ctx.fill();
}
var wrapImg=new Image();wrapImg.src='assets/textures/shawarma.png';
function drawPlate(c){
  var x=TABLES[c.table][0],y=TABLES[c.table][1];
  ctx.fillStyle='#F8F4EA';ctx.beginPath();ctx.ellipse(x-6,y+4,15,9,0,0,Math.PI*2);ctx.fill();
  if(wrapImg.complete&&wrapImg.naturalWidth){ctx.drawImage(wrapImg,x-15,y-30,18,48);return;}
  ctx.fillStyle='#D9B27A';rr(ctx,x-16,y-5,20,9,4);ctx.fill();
  ctx.fillStyle=MEAT[c.order.meat].c;rr(ctx,x-13,y-3,14,3,1.5);ctx.fill();
}
/* delivery thermo-bag: yellow cube, the lid swings up while the courier waits */
function drawBag(x,y,open){
  var w=28,h=24;
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(x,y+2,17,5,0,0,Math.PI*2);ctx.fill();
  if(open>0){
    ctx.fillStyle='#2B2B2B';ctx.fillRect(x-w/2+2,y-h+1,w-4,5);
    ctx.fillStyle='#E0640C';ctx.strokeStyle='#8A3D00';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x-w/2,y-h);ctx.lineTo(x+w/2,y-h);ctx.lineTo(x+w/2-2,y-h-14*open);ctx.lineTo(x-w/2+2,y-h-14*open);ctx.closePath();ctx.fill();ctx.stroke();
  }
  ctx.fillStyle=COURIER_COLOR;ctx.strokeStyle='#8A3D00';ctx.lineWidth=1.2;rr(ctx,x-w/2,y-h,w,h,3);ctx.fill();ctx.stroke();
  ctx.fillStyle='#1A1A1A';ctx.font='700 6.5px Onest,Arial,sans-serif';ctx.textAlign='center';
  var parts=COURIER_BRAND.split(' ');ctx.fillText(parts[0],x,y-h+10);if(parts[1])ctx.fillText(parts[1],x,y-h+18);
}
function drawPerson(c){
  if(c.courier&&c.state!=='wait'&&c.state!=='eat'){   /* bag on the back while walking */
    ctx.fillStyle=COURIER_COLOR;ctx.strokeStyle='#8A3D00';ctx.lineWidth=1;rr(ctx,c.x-14,c.y-24,28,22,3);ctx.fill();ctx.stroke();
  }
  var sit=(c.state==='wait'||c.state==='eat');
  var bob=c.moving?Math.sin(anim*12+c.table)*1.5:0;
  var x=c.x,y=c.y;
  if(G.sel===c){ctx.strokeStyle='#F2A93B';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x,y+12,17,7,0,0,Math.PI*2);ctx.stroke();}
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(x,y+12,11,4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=c.shirt;rr(ctx,x-10,y-14+bob,20,sit?20:26,6);ctx.fill();
  ctx.fillStyle=c.skin;ctx.beginPath();ctx.arc(x,y-22+bob,8.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=c.hair;ctx.beginPath();ctx.arc(x,y-24+bob,9,Math.PI,Math.PI*2);ctx.fill();
  if(c.courier){ctx.fillStyle=COURIER_COLOR;ctx.beginPath();ctx.arc(x,y-25+bob,9.5,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(x,y-26+bob,12,3);}
  ctx.fillStyle='#2B1D14';ctx.beginPath();ctx.arc(x-3,y-21+bob,1.2,0,Math.PI*2);ctx.arc(x+3,y-21+bob,1.2,0,Math.PI*2);ctx.fill();
  if(c.state==='wait'&&c.patience/c.maxP<.3){
    ctx.strokeStyle='#8A2A1A';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(x-5,y-25+bob);ctx.lineTo(x-1,y-23.5+bob);ctx.moveTo(x+5,y-25+bob);ctx.lineTo(x+1,y-23.5+bob);ctx.stroke();
  }
}
function drawBubble(c){
  var w=c.order.drink?70:54,bx=c.x-w/2,by=c.y-72,h=34,sel=(G.sel===c);
  var ratio=c.patience/c.maxP;
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(bx,by-8,w,4);
  ctx.fillStyle=ratio>.5?'#8FB339':(ratio>.25?'#F2A93B':'#D8432B');ctx.fillRect(bx,by-8,w*ratio,4);
  ctx.fillStyle='#FFF6E0';ctx.strokeStyle=sel?'#F2A93B':'#2B1D14';ctx.lineWidth=sel?3:1.5;
  rr(ctx,bx,by,w,h,8);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(c.x-5,by+h);ctx.lineTo(c.x+5,by+h);ctx.lineTo(c.x,by+h+6);ctx.closePath();ctx.fillStyle='#FFF6E0';ctx.fill();ctx.stroke();
  ctx.fillStyle=MEAT[c.order.meat].c;ctx.beginPath();ctx.arc(bx+12,by+17,7,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle=SAUCE[c.order.sauce].c;rr(ctx,bx+23,by+10,12,14,3);ctx.fill();ctx.stroke();
  ctx.strokeStyle='#9B6BB8';ctx.lineWidth=2;ctx.beginPath();ctx.arc(bx+44,by+17,5,0,Math.PI*2);ctx.stroke();
  if(!c.order.onion){ctx.strokeStyle='#D8432B';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx+38,by+25);ctx.lineTo(bx+50,by+9);ctx.stroke();}
  if(c.order.drink){
    ctx.fillStyle=DRINK[c.order.drink].c;ctx.strokeStyle='#2B1D14';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(bx+55,by+9);ctx.lineTo(bx+66,by+9);ctx.lineTo(bx+64,by+26);ctx.lineTo(bx+57,by+26);ctx.closePath();ctx.fill();ctx.stroke();
  }
}
function draw(){
  bg();
  for(var i=0;i<6;i++)drawTable(i);
  G.cust.forEach(function(c){if(c.state==='eat'&&!c.courier)drawPlate(c);});
  G.cust.forEach(function(c){if(c.courier&&(c.state==='wait'||c.state==='eat'))drawBag(c.x+24,c.y+12,c.bagOpen);});
  G.cust.slice().sort(function(a,b){return a.y-b.y;}).forEach(drawPerson);
  G.cust.forEach(function(c){if(c.state==='wait')drawBubble(c);});
  G.floats.forEach(function(f){
    ctx.globalAlpha=clamp(1.6-f.t,0,1);ctx.fillStyle=f.color;ctx.font='600 14px Onest,sans-serif';ctx.textAlign='center';
    ctx.strokeStyle='rgba(30,18,10,.8)';ctx.lineWidth=3;ctx.strokeText(f.text,f.x,f.y-f.t*26);ctx.fillText(f.text,f.x,f.y-f.t*26);
    ctx.globalAlpha=1;
  });
}

/* ---------- loop ---------- */
var last=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);if(!cv.hidden)draw();requestAnimationFrame(frame);
}
newGame();
var saved=loadSave();if(saved)applySave(saved);
if(/[?&]dev\b/.test(location.search)){G.dev=true;devTopUp();}
hud();renderBuild();showIntro();
requestAnimationFrame(frame);
})();
</script>
