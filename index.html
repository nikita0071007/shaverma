<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Моя шаверма</title>
<meta name="theme-color" content="#1F1712">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600&display=swap">
<style>
/* Layout: one column. Stage (hall or 3D kitchen, switched by tabs) on top, order panel under it; day summary slides over the stage. */
:root{
  --bg:#1F1712;
  --panel:#2B2019;
  --line:#4A382B;
  --cream:#F6E7C8;
  --muted:#B39B80;
  --turmeric:#F2A93B;
  --chili:#D8432B;
  --pistachio:#8FB339;
  --font-display:'Unbounded','Arial Black',sans-serif;
  --font-body:'Onest','Segoe UI',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg);color:var(--cream);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:600;font-size:clamp(22px,4.5vw,32px);margin:0;letter-spacing:.01em;color:var(--turmeric);text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.hud{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-width:96px}
.stat .k{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--font-display);font-size:18px;font-variant-numeric:tabular-nums}
.timebox{flex:1 1 180px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0}
.timebox .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.bar{height:6px;background:#140E0A;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--turmeric)}
.stage{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#C9AC7C}
#cv{display:block;width:100%;height:auto;aspect-ratio:640/400;touch-action:manipulation;cursor:pointer}
.overlay{position:absolute;inset:0;background:rgba(24,16,11,.93);padding:18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.overlay h2{font-family:var(--font-display);font-weight:600;font-size:clamp(18px,3.6vw,24px);margin:0;color:var(--turmeric);text-wrap:balance}
.overlay p{margin:0;color:var(--cream);max-width:60ch}
.overlay ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:60ch}
.facts{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--muted)}
.facts b{color:var(--cream);font-weight:600;font-variant-numeric:tabular-nums}
.upgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.upg{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.upg b{font-weight:600}
.upg span{color:var(--muted);font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--turmeric);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--chili);border-color:var(--chili);color:#FFF4DE;font-weight:600}
.btn.primary:hover{background:#E4543A}
.btn.go{background:var(--turmeric);border-color:var(--turmeric);color:#2B1A0A;font-weight:600;align-self:flex-start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:8px;margin-bottom:8px}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 16px;font-weight:600}
.tab[aria-pressed="true"]{background:var(--turmeric);border-color:var(--turmeric);color:#2B1A0A}
.tab span{font-weight:500;opacity:.8}
.kitchen{position:absolute;inset:0;background:#2a1d15;touch-action:none}
.kitchen canvas{display:block;width:100%;height:100%}
.khint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(24,16,11,.82);color:var(--cream);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;white-space:nowrap;pointer-events:none;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.tbar{margin-top:8px}
.build{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.build li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.build li span:last-child{color:var(--muted);text-align:right}
.build li.on span:last-child{color:var(--cream);font-weight:600}
.lbl{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.ticket{border:1px dashed var(--muted);border-radius:8px;padding:10px 12px;margin-bottom:12px;min-height:62px}
.ticket p{margin:0;font-size:16px;font-weight:500}
.btns{display:flex;gap:8px;width:100%}
.btns .btn{flex:1}
#msg{margin:0;min-height:20px;font-size:13px;color:var(--muted);text-align:center;width:100%}
/* Wide screens: header and HUD share a row, order panel sits beside the floor so nothing needs scrolling. */
.main{display:flex;flex-direction:column;gap:14px}
@media (min-width:1000px){
  .wrap{max-width:clamp(940px,calc((100vh - 176px)*1.6 + 354px),1280px)}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
  .hud{flex:0 1 640px}
  .main{display:grid;grid-template-columns:minmax(0,1fr) 340px;align-items:start}
  .main .panel{margin-top:44px}
}
/* Phones: full-screen game, no page scroll. Compact HUD on top, the stage takes all free height,
   tabs float over it, and a short order bar with the buttons sits at the bottom within thumb reach. */
@media (max-width:700px){
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  .wrap{height:100dvh;max-width:none;gap:6px;
    padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
  .top{display:flex;align-items:center;gap:8px}
  .top header{display:none}
  .hud{flex:1;gap:4px;flex-wrap:nowrap;min-width:0}
  .stat{min-width:0;padding:3px 7px;flex:none}
  .stat .k{font-size:9px}
  .stat .v{font-size:13px}
  .timebox{flex:1;padding:3px 7px;gap:3px}
  .timebox .k{font-size:9px}
  .timebox .k span:first-child{display:none}
  .main{flex:1;min-height:0;gap:6px}
  .col{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
  .tabs{position:absolute;top:8px;left:8px;z-index:3;margin:0}
  .tab{padding:5px 12px;font-size:13px;background:rgba(43,32,25,.88)}
  .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  #cv{max-height:100%;width:auto;max-width:100%;height:auto}
  .overlay{padding:56px 14px 14px}
  .khint{font-size:12px;bottom:8px;padding:4px 10px}
  .panel{flex:none;padding:8px;gap:6px}
  .ticket{padding:6px 10px;min-height:0}
  .ticket .lbl{display:none}
  .ticket p{font-size:14px}
  .tbar{margin-top:5px;height:4px}
  .panel .lbl{display:none}
  .build{flex-direction:row;flex-wrap:wrap;gap:4px}
  .build li{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;gap:4px}
  .build li span:first-child::after{content:':'}
  .build li.on{border-color:var(--turmeric)}
  .btn{padding:10px 14px}
  #msg{min-height:16px;font-size:12px}
}
.ovbtns{display:flex;flex-wrap:wrap;gap:10px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
  <header>
    <h1>Моя шаверма</h1>
    <p class="sub">Прототип: зал с гостями и 3D-кухня</p>
  </header>

  <div class="hud">
    <div class="stat"><span class="k">День</span><span class="v" id="hDay">1</span></div>
    <div class="stat"><span class="k">Деньги</span><span class="v" id="hMoney">0 ₽</span></div>
    <div class="stat"><span class="k">Репутация</span><span class="v" id="hRep">3.0 ★</span></div>
    <div class="timebox"><span class="k"><span>До закрытия</span><span id="hLeft">—</span></span><div class="bar"><i id="hTime"></i></div></div>
  </div>
  </div>

  <div class="main">
  <div class="col">
  <div class="tabs">
    <button class="tab" id="tabHall" aria-pressed="true">Зал <span id="waitN"></span></button>
    <button class="tab" id="tabKitchen" aria-pressed="false">Кухня</button>
  </div>
  <div class="stage">
    <canvas id="cv" width="640" height="400" aria-label="Зал шаурмичной"></canvas>
    <div class="kitchen" id="kitchen" hidden aria-label="Кухня: вертела, лаваш, овощи и соусы"></div>
    <div class="overlay" id="ov"></div>
  </div>
  </div>

  <section class="panel">
    <div class="ticket"><span class="lbl">Заказ гостя</span><p id="tkText">Нажмите на гостя с пузырём заказа.</p><div class="bar tbar"><i id="tkBar"></i></div></div>
    <div><span class="lbl">На лаваше</span><ul class="build" id="bl"></ul></div>
    <div class="btns">
      <button class="btn" id="reset">Сбросить</button>
      <button class="btn primary" id="serve">Подать</button>
    </div>
    <p id="msg" aria-live="polite"></p>
  </section>
  </div>
</div>

<script>
(function(){
var W=640,H=400;
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);

var MEAT={chicken:{name:'Курица',c:'#E6B04F'},beef:{name:'Говядина',c:'#8A3B22'}};
var SAUCE={garlic:{name:'Чесночный',c:'#FFF1CF'},spicy:{name:'Острый',c:'#D8432B'},cheese:{name:'Сырный',c:'#F2C23B'}};
var SAUCE_KEYS=['garlic','spicy','cheese'];
var TABLES=[[150,150],[150,265],[290,150],[290,265],[430,150],[430,265]];
var DOOR={x:662,y:348};
var SKIN=['#F2C9A0','#E0AC83','#C58C63','#8D5A3B'];
var SHIRT=['#3B82C4','#7A5CC4','#2A9D8F','#E9A23B','#C7546B','#4F7A3A','#5B6C8F'];
var HAIR=['#2B1D14','#5A3A22','#B5651D','#1A1A1A','#8A8A8A'];

var G,KST={meat:null,meatN:0,tomato:false,cucumber:false,onion:false,sauce:null};
var view='hall';
function K(){return window.Kitchen;}
var anim=0;

function newGame(){
  G={phase:'intro',day:1,money:0,rep:3,tables:3,comfort:0,sign:0,time:0,spawnT:1,cust:[],occ:[],sel:null,floats:[],stats:{served:0,lost:0,earned:0},lastLeft:-1};
}
/* ---------- save ---------- */
/* Progress is saved between days: a reload mid-day restarts that day with the money it opened with. */
var SAVE_KEY='shaverma-save-v1';
function save(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({v:1,day:G.phase==='summary'?G.day+1:G.day,money:G.money,rep:G.rep,tables:G.tables,comfort:G.comfort,sign:G.sign}));}catch(e){}
}
function loadSave(){
  try{var s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&s.v===1)return s;}catch(e){}
  return null;
}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function applySave(s){
  G.day=Math.max(1,s.day|0);G.money=Math.max(0,+s.money||0);G.rep=clamp(+s.rep||3,1,5);
  G.tables=clamp(s.tables|0,3,6);G.comfort=clamp(s.comfort|0,0,3);G.sign=clamp(s.sign|0,0,3);
}
function dayLen(){return Math.min(120,80+(G.day-1)*5);}
function fmt(n){return Math.round(n).toLocaleString('ru-RU')+' ₽';}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rnd(a,b){return a+Math.random()*(b-a);}

/* ---------- HUD ---------- */
function hud(){
  document.getElementById('hDay').textContent=G.day;
  document.getElementById('hMoney').textContent=fmt(G.money);
  document.getElementById('hRep').textContent=G.rep.toFixed(1)+' ★';
}
function msg(t){document.getElementById('msg').textContent=t;}

/* ---------- overlay ---------- */
var ov=document.getElementById('ov');
function showOv(html){ov.innerHTML=html;ov.hidden=false;}
function hideOv(){ov.hidden=true;}
function showIntro(){
  G.phase='intro';
  if(G.day>1){
    showOv('<h2>С возвращением!</h2>'+
      '<p>Шаверма ждёт. Прогресс сохранён.</p>'+
      '<div class="facts"><span>День: <b>'+G.day+'</b></span><span>В кассе: <b>'+fmt(G.money)+'</b></span><span>Репутация: <b>'+G.rep.toFixed(1)+' ★</b></span><span>Столиков: <b>'+G.tables+'</b></span></div>'+
      '<div class="ovbtns"><button class="btn go" id="start">Открыть день '+G.day+'</button><button class="btn" id="wipe">Начать заново</button></div>');
    document.getElementById('start').onclick=startDay;
    var wipe=document.getElementById('wipe');
    wipe.onclick=function(){
      if(!wipe.dataset.sure){wipe.dataset.sure='1';wipe.textContent='Точно? Прогресс сотрётся';return;}
      clearSave();newGame();hud();showIntro();
    };
    return;
  }
  showOv('<h2>Открываем шаверму</h2>'+
    '<p>Гости заходят, садятся за столики и ждут заказ. Чем быстрее и точнее вы соберёте шаверму, тем больше чаевых и выше репутация.</p>'+
    '<ol><li>Нажмите на гостя с пузырём заказа — откроется кухня.</li><li>Проведите по нужному вертелу, чтобы срезать мясо, добавьте помидоры и огурцы, лук — если просили, и полейте соусом.</li><li>Нажмите «Подать».</li></ol>'+
    '<button class="btn go" id="start">Открыть день 1</button>');
  document.getElementById('start').onclick=startDay;
}
var UPG=[
  {id:'tables',name:'Ещё один столик',desc:'Больше гостей в зале одновременно.',
    max:function(){return G.tables>=6;},lvl:function(){return (G.tables-3)+' из 3';},cost:function(){return 600+(G.tables-3)*250;},buy:function(){G.tables++;}},
  {id:'comfort',name:'Мягкие диванчики',desc:'Гости ждут заказ на 25% дольше.',
    max:function(){return G.comfort>=3;},lvl:function(){return G.comfort+' из 3';},cost:function(){return 700+G.comfort*500;},buy:function(){G.comfort++;}},
  {id:'sign',name:'Яркая вывеска',desc:'Гости приходят чаще.',
    max:function(){return G.sign>=3;},lvl:function(){return G.sign+' из 3';},cost:function(){return 800+G.sign*600;},buy:function(){G.sign++;}}
];
function showSummary(){
  G.phase='summary';setView('hall');
  save();
  var s=G.stats;
  var h='<h2>День '+G.day+' закончен</h2>'+
    '<div class="facts"><span>Заработано: <b>'+fmt(s.earned)+'</b></span><span>Обслужено: <b>'+s.served+'</b></span><span>Ушли недовольными: <b>'+s.lost+'</b></span><span>Репутация: <b>'+G.rep.toFixed(1)+' ★</b></span><span>В кассе: <b>'+fmt(G.money)+'</b></span></div>'+
    '<div><span class="lbl">Улучшения</span><div class="upgs">';
  UPG.forEach(function(u){
    h+='<div class="upg"><b>'+u.name+'</b><span>'+u.desc+'</span><span>Уровень: '+u.lvl()+'</span>'+
      (u.max()?'<span>Максимум</span>':'<button class="btn" data-u="'+u.id+'">Купить за '+fmt(u.cost())+'</button>')+'</div>';
  });
  h+='</div></div><p id="shopMsg" style="color:var(--muted);min-height:20px"></p><button class="btn go" id="next">Открыть день '+(G.day+1)+'</button>';
  showOv(h);
  ov.querySelectorAll('[data-u]').forEach(function(b){
    b.onclick=function(){
      var u=UPG.filter(function(x){return x.id===b.dataset.u;})[0];
      var c=u.cost();
      if(G.money<c){document.getElementById('shopMsg').textContent='Не хватает '+fmt(c-G.money)+'.';return;}
      G.money-=c;u.buy();hud();showSummary();
    };
  });
  document.getElementById('next').onclick=function(){G.day++;startDay();};
}

/* ---------- day flow ---------- */
function startDay(){
  G.phase='play';G.time=0;G.spawnT=1;G.cust=[];G.occ=[];G.sel=null;G.floats=[];G.lastLeft=-1;
  G.stats={served:0,lost:0,earned:0};
  resetBuild();setView('hall');updateTicket();msg('');hud();hideOv();
}
function maxPatience(){return Math.max(24,40-Math.min(G.day,8)*1.5)*(1+0.25*G.comfort);}
function nextInterval(){
  var base=8.5-G.sign*1.3-(G.rep-3)*0.7;
  return clamp(base*rnd(.8,1.2),3,12);
}
function spawn(){
  var free=[];
  for(var i=0;i<G.tables;i++)if(!G.occ[i])free.push(i);
  if(!free.length)return false;
  var t=free[Math.floor(Math.random()*free.length)];
  G.occ[t]=true;
  var seat={x:TABLES[t][0]-38,y:TABLES[t][1]+4};
  var lane=seat.x-32;
  var mp=maxPatience();
  var c={
    x:DOOR.x,y:DOOR.y,table:t,seat:seat,lane:lane,state:'enter',
    path:[{x:lane,y:348},{x:lane,y:seat.y},{x:seat.x,y:seat.y}],
    order:{meat:Math.random()<.5?'chicken':'beef',sauce:SAUCE_KEYS[Math.floor(Math.random()*3)],onion:Math.random()<.6},
    patience:mp,maxP:mp,eatT:0,pay:0,moving:true,
    skin:SKIN[Math.floor(Math.random()*SKIN.length)],shirt:SHIRT[Math.floor(Math.random()*SHIRT.length)],hair:HAIR[Math.floor(Math.random()*HAIR.length)]
  };
  G.cust.push(c);
  return true;
}
function moveAlong(c,dt){
  var left=95*dt;
  while(left>0&&c.path.length){
    var t=c.path[0],dx=t.x-c.x,dy=t.y-c.y,d=Math.hypot(dx,dy);
    if(d<=left){c.x=t.x;c.y=t.y;c.path.shift();left-=d;}
    else{c.x+=dx/d*left;c.y+=dy/d*left;left=0;}
  }
  return c.path.length===0;
}
function leave(c){
  c.state='leave';c.moving=true;G.occ[c.table]=false;
  c.path=[{x:c.lane,y:c.seat.y},{x:c.lane,y:348},{x:DOOR.x,y:348}];
  if(G.sel===c){G.sel=null;pickNext();}
}
function pickNext(){
  if(G.sel&&G.sel.state==='wait')return;
  G.sel=null;
  var best=null;
  G.cust.forEach(function(c){if(c.state==='wait'&&(!best||c.patience<best.patience))best=c;});
  G.sel=best;updateTicket();
}
function float(x,y,text,color){G.floats.push({x:x,y:y,text:text,color:color,t:0});}

function update(dt){
  anim+=dt;
  if(G.phase!=='play')return;
  G.time+=dt;
  var len=dayLen();
  if(G.time<len){
    G.spawnT-=dt;
    if(G.spawnT<=0)G.spawnT=spawn()?nextInterval():1;
  }
  G.cust.slice().forEach(function(c){
    if(c.state==='enter'){
      if(moveAlong(c,dt)){c.state='wait';c.moving=false;if(!G.sel){G.sel=c;updateTicket();}}
    }else if(c.state==='wait'){
      c.patience-=dt;
      if(c.patience<=0){
        G.rep=clamp(G.rep-0.3,1,5);G.stats.lost++;
        float(c.x,c.y-60,'Ушёл недовольным','#FF8A6B');
        leave(c);hud();
      }
    }else if(c.state==='eat'){
      c.eatT-=dt;
      if(c.eatT<=0){
        G.money+=c.pay;G.stats.earned+=c.pay;
        float(c.x,c.y-50,'+'+Math.round(c.pay)+' ₽','#F2A93B');
        leave(c);hud();
      }
    }else if(c.state==='leave'){
      if(moveAlong(c,dt)){G.cust.splice(G.cust.indexOf(c),1);}
    }
  });
  G.floats.forEach(function(f){f.t+=dt;});
  G.floats=G.floats.filter(function(f){return f.t<1.6;});
  var left=Math.max(0,Math.ceil(len-G.time));
  if(left!==G.lastLeft){
    G.lastLeft=left;
    document.getElementById('hLeft').textContent=left>0?left+' с':'закрываемся';
  }
  document.getElementById('hTime').style.width=clamp(G.time/len*100,0,100)+'%';
  document.getElementById('tkBar').style.width=(G.sel&&G.sel.state==='wait'?G.sel.patience/G.sel.maxP*100:0)+'%';
  var waiting=G.cust.filter(function(c){return c.state==='wait';}).length;
  var wt=waiting?'· ждут '+waiting:'';
  if(wt!==G.lastWait){G.lastWait=wt;document.getElementById('waitN').textContent=wt;}
  if(G.time>=len&&G.cust.length===0)showSummary();
}

/* ---------- builder (the 3D kitchen owns the lavash; this mirrors its state) ---------- */
var VEG_NAMES={tomato:'Помидоры',cucumber:'Огурцы',onion:'Лук'};
function resetBuild(){if(K())K().reset();else window.onKitchenChange({meat:null,meatN:0,tomato:false,cucumber:false,onion:false,sauce:null});}
window.onKitchenChange=function(st){KST=st;renderBuild();};
function renderBuild(){
  var need=K()?K().MEAT_NEED:3;
  var meat=KST.meat==='mixed'?'Смешали':KST.meat?MEAT[KST.meat].name:'—';
  var rows=[
    ['Мясо',KST.meatN?meat+' · '+Math.min(KST.meatN,need)+'/'+need:'—',KST.meatN>0],
    [VEG_NAMES.tomato,KST.tomato?'есть':'—',KST.tomato],
    [VEG_NAMES.cucumber,KST.cucumber?'есть':'—',KST.cucumber],
    [VEG_NAMES.onion,KST.onion?'есть':'—',KST.onion],
    ['Соус',KST.sauce==='mixed'?'Смешали':KST.sauce?SAUCE[KST.sauce].name:'—',!!KST.sauce]
  ];
  document.getElementById('bl').innerHTML=rows.map(function(r){
    return '<li'+(r[2]?' class="on"':'')+'><span>'+r[0]+'</span><span>'+r[1]+'</span></li>';
  }).join('');
}
function setView(v){
  view=v;
  document.getElementById('tabHall').setAttribute('aria-pressed',v==='hall'?'true':'false');
  document.getElementById('tabKitchen').setAttribute('aria-pressed',v==='kitchen'?'true':'false');
  if(K()){if(v==='kitchen')K().show();else K().hide();}
}
document.getElementById('tabHall').onclick=function(){setView('hall');};
document.getElementById('tabKitchen').onclick=function(){setView('kitchen');};
document.addEventListener('kitchenready',function(){setView(view);renderBuild();});
function orderText(o){
  return MEAT[o.meat].name+', '+SAUCE[o.sauce].name.toLowerCase()+' соус, '+(o.onion?'с луком':'без лука');
}
function updateTicket(){
  var el=document.getElementById('tkText');
  if(G.sel&&G.sel.state==='wait'){el.textContent='Стол '+(G.sel.table+1)+': '+orderText(G.sel.order);}
  else{el.textContent='Нажмите на гостя с пузырём заказа.';}
}
document.getElementById('reset').onclick=function(){resetBuild();msg('');};
document.getElementById('serve').onclick=function(){
  if(G.phase!=='play')return;
  var c=G.sel;
  if(!c||c.state!=='wait'){msg('Сначала выберите гостя с заказом.');return;}
  if(!KST.meatN){msg('Срежьте мясо с вертела.');setView('kitchen');return;}
  if(!KST.sauce){msg('Полейте соусом.');setView('kitchen');return;}
  var bad=[];
  if(KST.meat!==c.order.meat)bad.push('мясо');
  else if(KST.meatN<(K()?K().MEAT_NEED:3))bad.push('мало мяса');
  if(!KST.tomato||!KST.cucumber)bad.push('овощи');
  if(KST.onion!==c.order.onion)bad.push('лук');
  if(KST.sauce!==c.order.sauce)bad.push('соус');
  var tip=Math.round(100*(c.patience/c.maxP));
  c.pay=Math.max(100,250+tip-80*bad.length);
  c.state='eat';c.eatT=3.5;
  G.stats.served++;
  if(bad.length){
    G.rep=clamp(G.rep-0.1*bad.length,1,5);
    msg('Ошибка: '+bad.join(', ')+'. Гость недоволен, оплата ниже.');
  }else{
    G.rep=clamp(G.rep+0.1,1,5);
    msg('Идеально! Чаевые: '+tip+' ₽.');
  }
  G.sel=null;pickNext();updateTicket();hud();
  if(K())K().wrap(function(){if(G.phase==='play')setView('hall');});
  else resetBuild();
};
cv.addEventListener('pointerdown',function(e){
  if(G.phase!=='play')return;
  var r=cv.getBoundingClientRect();
  var x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  var best=null,bd=1e9;
  G.cust.forEach(function(c){
    if(c.state!=='wait')return;
    var d=Math.min(Math.hypot(x-c.x,y-(c.y-18)),Math.hypot(x-c.x,y-(c.y-52)));
    if(d<36&&d<bd){best=c;bd=d;}
  });
  if(best){G.sel=best;updateTicket();setView('kitchen');}
});

/* ---------- drawing ---------- */
function rr(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);
  c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();
}
function bg(){
  for(var y=90;y<H;y+=40)for(var x=0;x<W;x+=40){
    ctx.fillStyle=((x/40+(y-90)/40)%2===0)?'#CDB083':'#C2A476';ctx.fillRect(x,y,40,40);
  }
  ctx.fillStyle='#8C4A2F';ctx.fillRect(0,0,W,90);
  ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=1;
  for(var by=0;by<90;by+=15){ctx.beginPath();ctx.moveTo(0,by);ctx.lineTo(W,by);ctx.stroke();
    for(var bx=((by/15)%2)*20;bx<W;bx+=40){ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx,by+15);ctx.stroke();}}
  ctx.fillStyle='#5A2E1C';ctx.fillRect(0,86,W,6);
  /* counter */
  ctx.fillStyle='#4A2F1E';ctx.fillRect(20,78,430,22);
  ctx.fillStyle='#6B4429';ctx.fillRect(20,86,430,14);
  ctx.fillStyle='#C98B4A';ctx.fillRect(14,60,442,20);
  /* sign */
  ctx.fillStyle='#2B1D14';rr(ctx,250,6,190,26,5);ctx.fill();
  ctx.strokeStyle='#C98B4A';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#F2A93B';ctx.font='600 13px Unbounded,Arial Black,sans-serif';ctx.textAlign='center';ctx.fillText('МОЯ ШАВЕРМА',345,24);
  for(var k=0;k<4+G.sign*3;k++){
    var on=(Math.floor(anim*3)+k)%2===0;
    ctx.fillStyle=on?'#FFD27A':'#8A5A2A';
    ctx.beginPath();ctx.arc(256+k*(178/(3+G.sign*3)),9,1.8,0,Math.PI*2);ctx.fill();
  }
  /* spit */
  ctx.strokeStyle='#FF7A2F';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(86,28);ctx.lineTo(86,60);ctx.moveTo(134,28);ctx.lineTo(134,60);ctx.stroke();
  ctx.strokeStyle='#777';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(110,12);ctx.lineTo(110,62);ctx.stroke();
  ctx.fillStyle='#B5651D';ctx.beginPath();ctx.moveTo(94,62);ctx.lineTo(126,62);ctx.lineTo(121,22);ctx.lineTo(99,22);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#8C4A12';ctx.lineWidth=1.5;
  for(var s=0;s<5;s++){var yy=28+s*8,off=Math.sin(anim*2+s)*3;ctx.beginPath();ctx.moveTo(98+s*-1+off*0,yy);ctx.lineTo(122+s*1,yy);ctx.stroke();}
  ctx.fillStyle='rgba(255,230,170,.35)';var sx=104+Math.sin(anim*2.2)*6;ctx.fillRect(sx,24,3,36);
  /* grill */
  ctx.fillStyle='#2B2B2B';rr(ctx,170,62,64,14,3);ctx.fill();
  ctx.fillStyle='#C9743A';for(var g=0;g<4;g++){ctx.beginPath();ctx.arc(182+g*14,69,3,0,Math.PI*2);ctx.fill();}
  /* cook */
  ctx.fillStyle='#F2C9A0';ctx.beginPath();ctx.arc(250,54,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';rr(ctx,242,38,16,10,3);ctx.fill();
  /* sauces */
  [['#FFF1CF',290],['#D8432B',310],['#F2C23B',330]].forEach(function(b){
    ctx.fillStyle=b[0];rr(ctx,b[1]-6,44,12,22,3);ctx.fill();
    ctx.fillStyle='#444';ctx.fillRect(b[1]-3,40,6,5);
  });
  /* register */
  ctx.fillStyle='#3A3A3A';rr(ctx,384,46,40,24,4);ctx.fill();
  ctx.fillStyle='#8FB339';ctx.fillRect(390,50,28,8);
  ctx.fillStyle='#777';ctx.fillRect(390,62,28,4);
  /* menu board */
  ctx.fillStyle='#2B1D14';rr(ctx,478,12,140,62,5);ctx.fill();
  ctx.strokeStyle='#C98B4A';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#F6E7C8';ctx.textAlign='left';ctx.font='600 11px Onest,sans-serif';ctx.fillText('МЕНЮ',490,30);
  ctx.font='400 11px Onest,sans-serif';ctx.fillText('Шаверма  250 ₽',490,47);ctx.fillText('Чай  60 ₽',490,62);
  /* door and mat */
  ctx.fillStyle='#5C3B26';ctx.fillRect(596,326,44,50);
  ctx.fillStyle='#F6D98A';ctx.fillRect(630,300,10,96);
  ctx.fillStyle='#5C3B26';ctx.fillRect(626,296,4,104);
  /* plants */
  [[26,380],[560,150]].forEach(function(p){
    ctx.fillStyle='#7A4A2A';ctx.fillRect(p[0]-9,p[1],18,14);
    ctx.fillStyle='#4F7A3A';ctx.beginPath();ctx.arc(p[0]-6,p[1]-6,9,0,Math.PI*2);ctx.arc(p[0]+6,p[1]-8,10,0,Math.PI*2);ctx.arc(p[0],p[1]-14,8,0,Math.PI*2);ctx.fill();
  });
}
function drawTable(i){
  var x=TABLES[i][0],y=TABLES[i][1];
  if(i>=G.tables){
    ctx.setLineDash([5,5]);ctx.strokeStyle='rgba(246,231,200,.45)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.ellipse(x,y,36,22,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);return;
  }
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(x,y+10,38,22,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#6B3F22';rr(ctx,x-54,y-10,20,28,5);ctx.fill();
  ctx.fillStyle='#E0A862';ctx.strokeStyle='#8B5A33';ctx.lineWidth=3;
  ctx.beginPath();ctx.ellipse(x,y,36,22,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';rr(ctx,x+14,y-6,8,10,2);ctx.fill();
}
function drawPlate(c){
  var x=TABLES[c.table][0],y=TABLES[c.table][1];
  ctx.fillStyle='#F8F4EA';ctx.beginPath();ctx.ellipse(x-6,y,15,9,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#D9B27A';rr(ctx,x-16,y-5,20,9,4);ctx.fill();
  ctx.fillStyle=MEAT[c.order.meat].c;rr(ctx,x-13,y-3,14,3,1.5);ctx.fill();
}
function drawPerson(c){
  var sit=(c.state==='wait'||c.state==='eat');
  var bob=c.moving?Math.sin(anim*12+c.table)*1.5:0;
  var x=c.x,y=c.y;
  if(G.sel===c){ctx.strokeStyle='#F2A93B';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x,y+12,17,7,0,0,Math.PI*2);ctx.stroke();}
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(x,y+12,11,4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=c.shirt;rr(ctx,x-10,y-14+bob,20,sit?20:26,6);ctx.fill();
  ctx.fillStyle=c.skin;ctx.beginPath();ctx.arc(x,y-22+bob,8.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=c.hair;ctx.beginPath();ctx.arc(x,y-24+bob,9,Math.PI,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2B1D14';ctx.beginPath();ctx.arc(x-3,y-21+bob,1.2,0,Math.PI*2);ctx.arc(x+3,y-21+bob,1.2,0,Math.PI*2);ctx.fill();
  if(c.state==='wait'&&c.patience/c.maxP<.3){
    ctx.strokeStyle='#8A2A1A';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(x-5,y-25+bob);ctx.lineTo(x-1,y-23.5+bob);ctx.moveTo(x+5,y-25+bob);ctx.lineTo(x+1,y-23.5+bob);ctx.stroke();
  }
}
function drawBubble(c){
  var bx=c.x-27,by=c.y-72,w=54,h=34,sel=(G.sel===c);
  var ratio=c.patience/c.maxP;
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(bx,by-8,w,4);
  ctx.fillStyle=ratio>.5?'#8FB339':(ratio>.25?'#F2A93B':'#D8432B');ctx.fillRect(bx,by-8,w*ratio,4);
  ctx.fillStyle='#FFF6E0';ctx.strokeStyle=sel?'#F2A93B':'#2B1D14';ctx.lineWidth=sel?3:1.5;
  rr(ctx,bx,by,w,h,8);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(c.x-5,by+h);ctx.lineTo(c.x+5,by+h);ctx.lineTo(c.x,by+h+6);ctx.closePath();ctx.fillStyle='#FFF6E0';ctx.fill();ctx.stroke();
  ctx.fillStyle=MEAT[c.order.meat].c;ctx.beginPath();ctx.arc(bx+12,by+17,7,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle=SAUCE[c.order.sauce].c;rr(ctx,bx+23,by+10,12,14,3);ctx.fill();ctx.stroke();
  ctx.strokeStyle='#9B6BB8';ctx.lineWidth=2;ctx.beginPath();ctx.arc(bx+44,by+17,5,0,Math.PI*2);ctx.stroke();
  if(!c.order.onion){ctx.strokeStyle='#D8432B';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx+38,by+25);ctx.lineTo(bx+50,by+9);ctx.stroke();}
}
function draw(){
  bg();
  for(var i=0;i<6;i++)drawTable(i);
  G.cust.forEach(function(c){if(c.state==='eat')drawPlate(c);});
  G.cust.slice().sort(function(a,b){return a.y-b.y;}).forEach(drawPerson);
  G.cust.forEach(function(c){if(c.state==='wait')drawBubble(c);});
  G.floats.forEach(function(f){
    ctx.globalAlpha=clamp(1.6-f.t,0,1);ctx.fillStyle=f.color;ctx.font='600 14px Onest,sans-serif';ctx.textAlign='center';
    ctx.strokeStyle='rgba(30,18,10,.8)';ctx.lineWidth=3;ctx.strokeText(f.text,f.x,f.y-f.t*26);ctx.fillText(f.text,f.x,f.y-f.t*26);
    ctx.globalAlpha=1;
  });
}

/* ---------- loop ---------- */
var last=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);draw();requestAnimationFrame(frame);
}
newGame();
var saved=loadSave();if(saved)applySave(saved);
hud();renderBuild();showIntro();
requestAnimationFrame(frame);
})();
</script>
